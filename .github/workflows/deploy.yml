name: Deploy to AWS

on:
  workflow_dispatch: # Manual trigger

# Prevents two deployments from running at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Bootstrap S3 State Bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="anagram-tfstate-${ACCOUNT_ID}"
          echo "Using state bucket: $BUCKET_NAME"
          
          # Create bucket if it doesn't exist
          aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ secrets.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}
          
          # Enable versioning for safety
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
          
          # Save the bucket name for the next step
          echo "STATE_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve