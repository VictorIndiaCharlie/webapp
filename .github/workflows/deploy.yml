name: Deploy to AWS

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # AWS_REGION is intentionally a plain env var, NOT a secret:
    # GitHub masks secret values in logs, which turned the ALB DNS name
    # in the output into "anagram-alb-977742027.***.elb.amazonaws.com".
    env:
      AWS_REGION: eu-central-1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # SHA256 of the app source. Passed as a Terraform var: any code change
      # changes the EC2 user_data (which embeds the hash) -> instances are
      # replaced -> they boot with the fresh images.
      - name: Compute Code Hash
        run: |
          CODE_HASH=$(find backend frontend nginx -type f \
            -not -path '*/node_modules/*' \
            | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "CODE_HASH=${CODE_HASH}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Find S3 State Bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=anagram-tfstate-${ACCOUNT_ID}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> $GITHUB_ENV

      # The state bucket is the Terraform backend and is NOT created by Terraform.
      # It must exist before `terraform init` on a fresh account.
      # (Must live in eu-central-1 to match the backend region in providers.tf.)
      - name: Ensure State Bucket Exists
        run: |
          aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null || \
            aws s3api create-bucket --bucket "${STATE_BUCKET}" --region eu-central-1 \
            --create-bucket-configuration LocationConstraint=eu-central-1

      # --- TERRAFORM ---
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"

      # FIX: The artifacts bucket (module.artifact) and ECR repos (module.ecr) are
      # created BY Terraform, so they must be provisioned before the S3 upload
      # and docker push below. This mirrors terraform/deploy.sh.
      # module.iam is pulled in automatically as a dependency of module.artifact.
      - name: Terraform Pre-Apply (ECR + Artifact Bucket)
        working-directory: ./terraform
        run: terraform apply -auto-approve -target=module.ecr -target=module.artifact

      # --- Build and Push to ECR (repos now exist) ---
      - name: Build and Push Docker Images
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker build -t ${{ env.ECR_REGISTRY }}/anagram-backend:latest ./backend
          docker build -t ${{ env.ECR_REGISTRY }}/anagram-frontend:latest ./frontend
          docker build -t ${{ env.ECR_REGISTRY }}/anagram-nginx:latest ./nginx
          
          docker push ${{ env.ECR_REGISTRY }}/anagram-backend:latest
          docker push ${{ env.ECR_REGISTRY }}/anagram-frontend:latest
          docker push ${{ env.ECR_REGISTRY }}/anagram-nginx:latest

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var "code_hash=${CODE_HASH}"

      - name: Integration Test (Live API)
        working-directory: ./terraform
        run: |
          URL="http://$(terraform output -raw alb_dns_name)"
          echo "Testing API at $URL..."
          
          # 1. Test DB Connectivity
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed with status $STATUS"
            exit 1
          fi
          echo "✅ Health check passed (DB is connected)"

          # 2. Test Anagram Logic
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/anagrams?word=maria")
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Anagram API failed with status $STATUS"
            exit 1
          fi
          echo "✅ Anagram API passed"
