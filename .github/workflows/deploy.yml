name: Deploy to AWS

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Find S3 State Bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=anagram-tfstate-${ACCOUNT_ID}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_ENV

      # --- NEW: Create Tarball and Upload to S3 ---
      - name: Upload Configuration to S3
        run: |
          # Note: This assumes the S3 bucket already exists via Terraform. 
          # If it's a fresh deploy, you might need to run a partial `terraform apply` first.
          tar --exclude='.git' --exclude='node_modules' --exclude='terraform' -czf /tmp/anagram-app.tar.gz -C . .
          aws s3 cp /tmp/anagram-app.tar.gz s3://anagram-artifacts-$(aws sts get-caller-identity --query Account --output text)/anagram-app.tar.gz

      # --- NEW: Build and Push to ECR ---
      - name: Build and Push Docker Images
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          docker build -t ${{ env.ECR_REGISTRY }}/anagram-backend:latest ./backend
          docker build -t ${{ env.ECR_REGISTRY }}/anagram-frontend:latest ./frontend
          docker build -t ${{ env.ECR_REGISTRY }}/anagram-nginx:latest ./nginx
          
          docker push ${{ env.ECR_REGISTRY }}/anagram-backend:latest
          docker push ${{ env.ECR_REGISTRY }}/anagram-frontend:latest
          docker push ${{ env.ECR_REGISTRY }}/anagram-nginx:latest

      # --- TERRAFORM ---
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve