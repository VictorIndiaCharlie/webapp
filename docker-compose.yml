services:
  db:
    image: postgres:16-alpine
    container_name: anagram_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anagrams}
      POSTGRES_USER: ${POSTGRES_USER:-anagram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anagram}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anagram} -d ${POSTGRES_DB:-anagrams}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: anagram_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-anagrams}
      POSTGRES_USER: ${POSTGRES_USER:-anagram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anagram}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: anagram_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: ./nginx
    container_name: anagram_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  db_data: